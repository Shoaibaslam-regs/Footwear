# Runs every test on each push and pull request, on GitHub's servers, with a
# temporary MongoDB of its own: the live database is never touched.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_URI: mongodb://localhost:27017/footwear
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      UPLOADTHING_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Route types (PageProps, LayoutProps) are generated into .next/types: a fresh
      # checkout has none, so generate them before type-checking (no database needed).
      - name: Generate route types
        run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npx playwright test
      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
